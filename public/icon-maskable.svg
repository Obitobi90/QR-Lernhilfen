<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient (full bleed without rounded corners for maskable) -->
    <linearGradient id="bgGradMask" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#312E81"/>
      <stop offset="45%" stop-color="#4338CA"/>
      <stop offset="100%" stop-color="#6366F1"/>
    </linearGradient>

    <!-- Card Gradient -->
    <linearGradient id="cardGradMask" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F8FAFC"/>
    </linearGradient>

    <!-- Back Card Gradient -->
    <linearGradient id="backCardGradMask" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818CF8" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#C7D2FE" stop-opacity="0.15"/>
    </linearGradient>

    <!-- Sparkle Gold Gradient -->
    <linearGradient id="goldGradMask" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCD34D"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>

    <!-- Drop Shadows -->
    <filter id="shadowMainMask" x="-15%" y="-15%" width="130%" height="135%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#0F172A" flood-opacity="0.35"/>
    </filter>

    <filter id="shadowGlowMask" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="8" flood-color="#F59E0B" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Full-bleed background for Android Maskable -->
  <rect width="512" height="512" fill="url(#bgGradMask)"/>

  <!-- Scaled group into the 80% safe zone (center 256, 256) -->
  <g transform="translate(256, 256) scale(0.82) translate(-256, -256)">
    <!-- Stacked Background Card 2 -->
    <rect x="156" y="96" width="220" height="270" rx="26" transform="rotate(8 266 231)" fill="url(#backCardGradMask)" stroke="#FFFFFF" stroke-opacity="0.25" stroke-width="2"/>

    <!-- Stacked Background Card 1 -->
    <rect x="136" y="104" width="240" height="290" rx="26" transform="rotate(-6 256 249)" fill="url(#backCardGradMask)" stroke="#FFFFFF" stroke-opacity="0.35" stroke-width="2.5"/>

    <!-- Foreground Main Hint Card -->
    <g filter="url(#shadowMainMask)">
      <rect x="131" y="116" width="250" height="300" rx="28" fill="url(#cardGradMask)" stroke="#E2E8F0" stroke-width="2.5"/>

      <!-- Card Header Accent Band -->
      <path d="M 131 144 C 131 128.5 143.5 116 159 116 L 353 116 C 368.5 116 381 128.5 381 144 L 381 154 L 131 154 Z" fill="#EEF2FF"/>
      <circle cx="156" cy="135" r="4.5" fill="#6366F1"/>
      <circle cx="170" cy="135" r="4.5" fill="#818CF8"/>
      <circle cx="184" cy="135" r="4.5" fill="#C7D2FE"/>

      <!-- Stepped Hint Bars -->
      <rect x="296" y="131" width="18" height="7" rx="3.5" fill="#4338CA"/>
      <rect x="320" y="128" width="20" height="10" rx="4" fill="#4F46E5"/>
      <rect x="346" y="124" width="22" height="14" rx="4.5" fill="#6366F1"/>

      <!-- QR Code Matrix -->
      <rect x="166" y="174" width="56" height="56" rx="12" fill="#1E1B4B"/>
      <rect x="176" y="184" width="36" height="36" rx="6" fill="#FFFFFF"/>
      <rect x="184" y="192" width="20" height="20" rx="4" fill="#4338CA"/>

      <rect x="290" y="174" width="56" height="56" rx="12" fill="#1E1B4B"/>
      <rect x="300" y="184" width="36" height="36" rx="6" fill="#FFFFFF"/>
      <rect x="308" y="192" width="20" height="20" rx="4" fill="#4338CA"/>

      <rect x="166" y="298" width="56" height="56" rx="12" fill="#1E1B4B"/>
      <rect x="176" y="308" width="36" height="36" rx="6" fill="#FFFFFF"/>
      <rect x="184" y="316" width="20" height="20" rx="4" fill="#4338CA"/>

      <rect x="238" y="174" width="16" height="22" rx="4" fill="#4338CA"/>
      <rect x="260" y="174" width="14" height="14" rx="3.5" fill="#1E1B4B"/>
      <rect x="238" y="206" width="20" height="20" rx="4.5" fill="#6366F1"/>
      <rect x="264" y="196" width="12" height="32" rx="4" fill="#312E81"/>

      <rect x="166" y="246" width="22" height="16" rx="4" fill="#1E1B4B"/>
      <rect x="196" y="240" width="14" height="22" rx="4" fill="#4338CA"/>
      <rect x="220" y="238" width="24" height="24" rx="5" fill="#4F46E5"/>
      <rect x="252" y="236" width="18" height="18" rx="4" fill="#1E1B4B"/>
      <rect x="278" y="244" width="26" height="18" rx="4.5" fill="#4338CA"/>
      <rect x="312" y="240" width="16" height="24" rx="4" fill="#6366F1"/>
      <rect x="334" y="246" width="12" height="16" rx="3" fill="#1E1B4B"/>

      <rect x="238" y="274" width="18" height="18" rx="4" fill="#312E81"/>
      <rect x="264" y="268" width="16" height="26" rx="4" fill="#4338CA"/>
      <rect x="290" y="276" width="22" height="16" rx="4" fill="#1E1B4B"/>
      <rect x="320" y="274" width="26" height="22" rx="4.5" fill="#4F46E5"/>

      <rect x="238" y="304" width="24" height="24" rx="5" fill="#6366F1"/>
      <rect x="270" y="310" width="20" height="18" rx="4" fill="#1E1B4B"/>
      <rect x="298" y="306" width="48" height="48" rx="10" fill="#1E1B4B"/>
      <rect x="306" y="314" width="32" height="32" rx="5" fill="#FFFFFF"/>
      <rect x="314" y="322" width="16" height="16" rx="3.5" fill="#4338CA"/>

      <rect x="238" y="336" width="18" height="18" rx="4" fill="#4338CA"/>
      <rect x="264" y="336" width="24" height="16" rx="4" fill="#312E81"/>

      <rect x="166" y="376" width="180" height="6" rx="3" fill="#E2E8F0"/>
      <rect x="166" y="390" width="110" height="5" rx="2.5" fill="#CBD5E1"/>
    </g>

    <!-- Golden Insight Sparkle -->
    <g filter="url(#shadowGlowMask)" transform="translate(365, 105)">
      <path d="M 0 -28 C 1 -10 10 -1 28 0 C 10 1 1 10 0 28 C -1 10 -10 1 -28 0 C -10 -1 -1 -10 0 -28 Z" fill="url(#goldGradMask)"/>
      <circle cx="0" cy="0" r="7" fill="#FFFFFF"/>
    </g>
  </g>
</svg>
