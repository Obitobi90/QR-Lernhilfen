  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <meta name="description" content="Moderne Web-App für den Schulunterricht: Gestufte Tippkarten per QR-Code für Schüler, KaTeX-Formeln, Multimedia, didaktischer KI-Tipp-Generator und Supabase-Integration." />
    <meta property="og:title" content="Digitale QR-Lernhilfen &amp; Gestufte Tippkarten" />
    <meta property="og:description" content="Moderne Web-App für den Schulunterricht: Gestufte Tippkarten per QR-Code für Schüler, KaTeX-Formeln, Multimedia, didaktischer KI-Tipp-Generator und Supabase-Integration." />
    <meta property="og:type" content="website" />
    <meta name="theme-color" content="#4F46E5" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Lernhilfen" />
    
    <!-- Apple Touch Icons for iOS (iPhone & iPad) -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    
    <!-- Android & Web App Manifest -->
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css" crossorigin="anonymous">

    <script>
      (function() {
        // Suppress WebSocket errors originating from Vite HMR in AI Studio preview
        const origError = console.error;
        console.error = function(...args) {
          const isWsError = args.some(function(arg) {
            if (typeof arg === 'string') return arg.includes('WebSocket') || arg.includes('[vite]');
            if (arg && arg.message) return String(arg.message).includes('WebSocket') || String(arg.message).includes('[vite]');
            if (arg && arg.stack) return String(arg.stack).includes('@vite/client');
            return false;
          });
          if (isWsError) return;
          origError.apply(console, args);
        };

        window.addEventListener('error', function(event) {
          if (event && (
            (event.message && String(event.message).includes('WebSocket')) ||
            (event.filename && String(event.filename).includes('@vite/client'))
          )) {
            event.stopImmediatePropagation();
            event.preventDefault();
          }
        }, true);

        try {
          const saved = localStorage.getItem('lernhilfen_dark_mode');
          const prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
          if (saved === 'true' || (saved === null && prefersDark)) {
            document.documentElement.classList.add('dark');
            document.documentElement.setAttribute('data-theme', 'dark');
          } else {
            document.documentElement.classList.remove('dark');
            document.documentElement.removeAttribute('data-theme');
          }
        } catch(e) {}
      })();
    </script>
  </head>
  <body class="bg-slate-50 text-slate-900 dark:bg-slate-950 dark:text-slate-100 min-h-screen antialiased selection:bg-indigo-500 selection:text-white">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
